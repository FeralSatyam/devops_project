name: Deploy Panipuri shop to EC2

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "infra/**"
      - ".github/workflows/workflow.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "infra/**"
      - ".github/workflows/workflow.yaml"
  workflow_dispatch:
    inputs:
      instance_type:
        description: EC2 instance type
        default: t3.small
        type: choice
        options: [t2.micro, t2.small, t2.medium, t3.micro, t3.small, t3.medium]

concurrency: deploy

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: panipuri-shop-stack
  TEMPLATE: infra/ec2-instance.yaml
  SSH_OPTS: -i ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body "file://$TEMPLATE"

      - name: Create or update EC2 stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file "$TEMPLATE" \
            --parameter-overrides "InstanceType=${{ inputs.instance_type || 't3.small' }}" \
            --no-fail-on-empty-changeset

      - name: Start instance and find its public IP
        id: instance
        run: |
          output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }

          INSTANCE_ID=$(output InstanceId)
          KEY_ID=$(output KeyPairId)
          SECURITY_GROUP_ID=$(output SecurityGroupId)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::CloudFormation did not return an instance ID."
            exit 1
          fi

          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Instance $INSTANCE_ID is $STATE"
          if [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            STATE=stopped
          fi
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "::error::The EC2 instance has no public IP address."
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "security_group_id=$SECURITY_GROUP_ID" >> "$GITHUB_OUTPUT"

      - name: Find GitHub runner public IP
        id: runner-ip
        run: echo "cidr=$(curl -fsS https://api.ipify.org)/32" >> "$GITHUB_OUTPUT"

      - name: Temporarily allow SSH from this runner
        id: allow-ssh
        env:
          SECURITY_GROUP_ID: ${{ steps.instance.outputs.security_group_id }}
          RUNNER_CIDR: ${{ steps.runner-ip.outputs.cidr }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR"

      - name: Get SSH key from SSM
        env:
          KEY_ID: ${{ steps.instance.outputs.key_id }}
        run: |
          aws ssm get-parameter \
            --name "/ec2/keypair/$KEY_ID" \
            --with-decryption \
            --query Parameter.Value \
            --output text > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Wait for SSH and first-boot setup
        env:
          IP: ${{ steps.instance.outputs.ip }}
        run: |
          ready=false
          for i in $(seq 1 30); do
            if ssh $SSH_OPTS "ubuntu@$IP" true; then
              ready=true
              break
            fi
            echo "SSH not ready yet ($i/30), retrying in 10 seconds..."
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "::error::Could not connect to EC2 over SSH after 5 minutes."
            exit 1
          fi

          if ! ssh $SSH_OPTS "ubuntu@$IP" 'sudo cloud-init status --wait'; then
            echo "::error::EC2 first-boot setup failed. Last lines of its log:"
            ssh $SSH_OPTS "ubuntu@$IP" 'sudo tail -n 40 /var/log/cloud-init-output.log'
            exit 1
          fi

      - name: Copy project to EC2 and start Docker Compose
        env:
          IP: ${{ steps.instance.outputs.ip }}
        run: |
          ARCHIVE="$RUNNER_TEMP/panipuri-project.tar.gz"
          tar -czf "$ARCHIVE" \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            -C "$GITHUB_WORKSPACE" .
          scp $SSH_OPTS "$ARCHIVE" "ubuntu@$IP:/tmp/panipuri-project.tar.gz"
          ssh $SSH_OPTS "ubuntu@$IP" \
            'sudo install -d -o ubuntu -g ubuntu /opt/panipuri &&
             tar -xzf /tmp/panipuri-project.tar.gz -C /opt/panipuri &&
             rm /tmp/panipuri-project.tar.gz &&
             cd /opt/panipuri &&
             sudo docker compose up -d --build --remove-orphans'

      - name: Check the deployed site
        env:
          IP: ${{ steps.instance.outputs.ip }}
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-connrefused "http://$IP" |
            grep -q '<title>Pani Puri House'

      - name: Show deployment URL
        env:
          IP: ${{ steps.instance.outputs.ip }}
        run: echo "### Live at http://$IP" >> "$GITHUB_STEP_SUMMARY"

      - name: Revoke temporary SSH access
        if: always() && steps.allow-ssh.outcome == 'success'
        env:
          SECURITY_GROUP_ID: ${{ steps.instance.outputs.security_group_id }}
          RUNNER_CIDR: ${{ steps.runner-ip.outputs.cidr }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR"

      - name: Remove deployment files from runner
        if: always()
        run: |
          rm -f ec2-key.pem "$RUNNER_TEMP/panipuri-project.tar.gz"
