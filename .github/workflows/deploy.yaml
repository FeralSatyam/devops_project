name: Deploy Panipuri shop to EC2

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "infra/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:
    inputs:
      instance_type:
        description: EC2 instance type
        default: t3.small
        type: choice
        options: [t2.micro, t2.small, t2.medium, t3.micro, t3.small, t3.medium]

concurrency:
  group: deploy-panipuri-shop
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: panipuri-shop-stack
  TEMPLATE: infra/ec2-instance.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_OPTS: -i ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate template
        run: aws cloudformation validate-template --template-body file://${{ env.TEMPLATE }}

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file "$TEMPLATE" \
            --parameter-overrides InstanceType="${{ inputs.instance_type || 't3.small' }}" \
            --no-fail-on-empty-changeset

      - name: Find instance and allow runner SSH
        id: instance
        env:
          INSTANCE_TYPE: ${{ inputs.instance_type || 't3.small' }}
        run: |
          output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          INSTANCE_ID=$(output InstanceId)
          KEY_ID=$(output KeyPairId)
          SG_ID=$(output SecurityGroupId)
          IP=$(output PublicIp)

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "Instance $INSTANCE_ID is $STATE"
          if [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            STATE=stopped
          fi
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            IP=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].PublicIpAddress" \
              --output text)
          fi
          if [ "$STATE" = "running" ]; then
            IP=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].PublicIpAddress" \
              --output text)
          fi

          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          EXISTS=$(aws ec2 describe-security-groups \
            --group-ids "$SG_ID" \
            --query "length(SecurityGroupIpPermissions[?FromPort==\`22\` && ToPort==\`22\` && contains(IpRanges[*].CidrIp, '${RUNNER_IP}/32')])" \
            --output text)
          if [ "$EXISTS" = "0" ]; then
            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" \
              --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='GitHub Actions deployment'}]"
          fi

          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "security_group_id=$SG_ID" >> "$GITHUB_OUTPUT"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      - name: Get SSH key from SSM
        run: |
          aws ssm get-parameter \
            --name "/ec2/keypair/${{ steps.instance.outputs.key_id }}" \
            --with-decryption \
            --query Parameter.Value \
            --output text > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Wait for SSH and first-boot setup
        env:
          IP: ${{ steps.instance.outputs.ip }}
        run: |
          READY=false
          for i in $(seq 1 30); do
            if ssh $SSH_OPTS ubuntu@"$IP" true; then
              READY=true
              break
            fi
            echo "SSH not ready yet ($i/30), retrying in 10s..."
            sleep 10
          done
          if [ "$READY" != "true" ]; then
            echo "::error::SSH did not become available on the instance"
            exit 1
          fi

          status=0
          ssh $SSH_OPTS ubuntu@"$IP" 'sudo cloud-init status --wait' || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error::UserData failed on the instance. Last lines of its log:"
            ssh $SSH_OPTS ubuntu@"$IP" 'sudo tail -n 40 /var/log/cloud-init-output.log'
            exit 1
          fi

      - name: Transfer project
        env:
          IP: ${{ steps.instance.outputs.ip }}
        run: |
          tar -czf panipuri-shop.tar.gz \
            --exclude=.git \
            --exclude='*/node_modules' \
            docker-compose.yml frontend backend
          scp $SSH_OPTS panipuri-shop.tar.gz ubuntu@"$IP":/tmp/panipuri-shop.tar.gz

      - name: Start Docker Compose stack
        env:
          IP: ${{ steps.instance.outputs.ip }}
        run: |
          ssh $SSH_OPTS ubuntu@"$IP" '
            set -e
            rm -rf /home/ubuntu/panipuri-shop
            mkdir -p /home/ubuntu/panipuri-shop
            tar -xzf /tmp/panipuri-shop.tar.gz -C /home/ubuntu/panipuri-shop
            rm /tmp/panipuri-shop.tar.gz
            cd /home/ubuntu/panipuri-shop
            sudo docker compose down --remove-orphans
            sudo docker compose up -d --build
            sudo docker compose ps
          '

      - name: Check the site is live
        env:
          IP: ${{ steps.instance.outputs.ip }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused \
            "http://$IP" | grep -q 'Pani Puri House'

      - name: Show outputs
        run: |
          echo "### Live at http://${{ steps.instance.outputs.ip }}" >> "$GITHUB_STEP_SUMMARY"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --output table | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Revoke runner SSH
        if: always()
        run: |
          if [ -n "${{ steps.instance.outputs.security_group_id }}" ] && [ -n "${{ steps.instance.outputs.runner_ip }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ steps.instance.outputs.security_group_id }}" \
              --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.instance.outputs.runner_ip }}/32}]" \
              || true
          fi

      - name: Remove SSH key
        if: always()
        run: rm -f ec2-key.pem panipuri-shop.tar.gz
